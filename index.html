<style>
  /* Self-contained (no dependency on index.css, which may not have finished
     loading/parsing yet) styling for #preboot below - a static stand-in for
     the real <Loader> that only exists so the very first thing painted is a
     loading screen, not the raw SEO/LCP hero markup underneath it. React
     replaces this whole #root subtree - preboot included - the instant it
     mounts, handing off to the real, interactive Loader mid-boot with no
     visible gap. Kept intentionally close to .loader's own look (same ink
     background, same centered heart mark) so that handoff reads as
     continuous rather than a swap. */
  #preboot{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:#0F0F13}
  #preboot svg{width:40px;height:40px;animation:preboot-pulse 1.1s ease-in-out infinite}
  @keyframes preboot-pulse{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){#preboot svg{animation:none;opacity:1}}
</style>
<!-- #preboot exists purely to bridge the gap until React mounts and takes
     over. With JS disabled nothing ever removes it, which would otherwise
     permanently hide both the SEO fallback above and the <noscript> message
     below it - so a no-JS visitor (or a crawler that doesn't run JS) never
     even sees this element in the first place. -->
<noscript><style>#preboot{display:none}</style></noscript>
</head>
